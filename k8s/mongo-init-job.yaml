apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: emi
spec:
  backoffLimit: 5
  template:
    spec:
      containers:
      - name: mongo-init
        image: mongo:6.0
        command:
        - mongosh
        - --host
        - mongo-0.mongo:27017
        - --eval
        - 'try { rs.status(); print("Already initiated."); } catch(e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo-0.mongo:27017"}, {_id: 1, host: "mongo-1.mongo:27017"}, {_id: 2, host: "mongo-2.mongo:27017"}]}); print("Initiated successfully."); }'
      restartPolicy: OnFailure
